name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        include:
          # Test latest Python on every supported OS
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
        exclude:
          # Skip the 3.13 Python on every OS below; the include section
          # covers it on each one (avoids running the same combo twice).
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: pip install "pywin32>=306"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify server starts (smoke test)
        run: python -c "import sys; sys.path.insert(0, '.'); from src.server import create_app; app = create_app(); print('Server OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: |
          pip install "ruff>=0.9.0"
      - name: Run ruff
        run: |
          ruff check src/ tests/

      - name: Check param naming standard (old_str/new_str)
        run: |
          if git grep -nE "old_string|new_string|oldText|newText" -- src/ tests/ README.md; then
            echo "FAIL: usa old_str/new_str (contrato canonico). CHANGELOG.md historico esta excluido."
            exit 1
          fi

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run security-focused tests
        run: |
          python -m pytest tests/test_security.py tests/test_permissions.py tests/test_secretscanner.py -v