[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "personal-mcp"
version = "1.4.32"
description = "Custom MCP server for Windows workstation orchestration"

requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.0",
    "pydantic>=2.0.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pytest-asyncio]
default_async_timeout = 30
